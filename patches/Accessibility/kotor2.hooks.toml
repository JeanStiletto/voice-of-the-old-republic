# CSWCCreature::PlayFootstep — K2 twin @0x00765E90 (K1 0x0061A2D0). Found by
# the Play3DOneShotSound-facade (0x0070BA90) caller sweep after the Batch-5
# candidate 0x0077D390 was REFUTED: that function is the class-selection
# screen's idle-fidget driver (rand-picked "greeting"/"hturnl"/"hturnr"/
# "pause*" animations; its callers construct CSWGuiClassSelection), not
# footsteps. Twin identity is decompile-matched landmark for landmark: same
# [this+0x20] early-out, appearance-2DA FootstepType + footstepsounds reads,
# surfacemat name + rand()%3 variant concat, K1's exact priority-group
# constants (player 0x13, size category 1-3 0x14, else 0x12), the
# listener-distance gate (max+2.0), Play3DOneShotSound, footprint-visual
# twin 0x00772900, water DoFootstepAudio twin 0x00773560, rumble
# 0x00766460. Play-vs-compute split verified: like K1, this one function
# both builds the resref AND plays it, so owning its early-out suppresses
# audio + footprint + rumble together. (K2 novelty, no handler impact: a
# separate stealth-silence branch skips only the audio when the server
# creature's +0x518 byte is set while [this+0x19c]==1.)
#
# Hooked at the engine's own early-out branch, K1-style, but the Aspyr
# build's branch sense is INVERTED — the JNZ jumps to the play path and
# falls through into the early-out destructor cascade:
#
#   00765ede: 8b 85 20 ff ff ff     MOV EAX,[EBP-0xE0]    ; `this` reload
#   00765ee4: 8b 48 20              MOV ECX,[EAX+0x20]    ; K1's same field
#   00765ee7: 89 4d c4              MOV [EBP-0x3C],ECX
#   00765eea: 83 7d c4 00           CMP [EBP-0x3C],0x0    <- hook here, 6 bytes
#   00765eee: 75 20                 JNZ 0x00765f10        ; (in cut) play path
#   00765ef0: c6 45 fc 00           MOV byte [EBP-4],0    ; early-out cascade:
#   00765ef4: ...                   ; two CExoString dtors, JMP 0x00766446
#
# skip_original_bytes = true: the cut's only effect is EFLAGS (the CMP),
# consumed solely by the JNZ we own — nothing to replay, and no EAX/EFLAGS
# clobber hazard (the K1 entry's two dead-end attempts). Handler return:
#   nonzero -> consumed_exit 0x00765F10, the play path (its first
#              instruction re-derives `this` from the frame; EAX/ECX/EDX
#              are all written before read on that path)
#   0       -> natural resume 0x00765EF0, the engine's own early-out
#              cascade (strings destructed, SEH restored at the common
#              exit 0x00766446)
# INVERTED vs the K1 entry, where return 1 suppresses — the handler maps
# the shared verdict per game (OnPlayFootstep in audio_footstep_suppress.cpp).
# The cut has no stack effect and both destinations are mid-body points at
# identical stack depth with the SEH frame still registered, so the b558b5b
# epilogue constraint does not arise here.
#
# Parameter: EAX = `this` (CSWCCreature*), loaded from the frame two
# instructions above the cut and untouched in between.
[[hooks]]
address = 0x00765eea
type = "detour"
function = "OnPlayFootstep"

# 83 7d c4 00           CMP dword ptr [EBP-0x3C], 0
# 75 20                 JNZ 0x00765f10
original_bytes = [0x83, 0x7d, 0xc4, 0x00, 0x75, 0x20]

skip_original_bytes = true
exclude_from_restore = ["eax"]
consumed_exit_address = 0x00765f10

