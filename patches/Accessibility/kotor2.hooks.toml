# MOV EBP,ESP; SUB ESP,0x40) on BOTH paths: return 0 → fall through into
# the engine body with the frame built (jitter runs); nonzero → jump to
# consumed_exit_address 0x0071062A, the epilogue (MOV ESP,EBP; POP EBP;
# RET), which unwinds the frame the cut built. The bare RET at 0x0071062D
# would pop a stack local as the return address (same crash class as the
