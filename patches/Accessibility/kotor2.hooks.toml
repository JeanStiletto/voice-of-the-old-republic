# ============================================================================
# Batch 3c — Interaction: the in-world input pipeline
# ============================================================================
# CClientExoAppInternal::HandleInputEvent @0x007B12C0 (K1 0x00621210). The
# in-world event dispatcher: modifier-space reservation, overlay-Esc consume,
# bare-1..7 dispatch prep and Q/E reannounce all live in the shared handler.
# Identity: Batch 2's caller-trace found it as "the dispatcher"; it calls
# GetDefaultActions (0x007B40F0) from its Q/E cases and forwards to
# CSWGuiManager::HandleInputEvent (0x00410AA0) at its tail.
#
# Hooked at 0x007B12EE, after SEH registration + the `this` store:
#   007b12e2: 64 a3 00 00 00 00     MOV FS:[0],EAX         ; SEH registered
#   007b12e8: 89 8d fc fc ff ff     MOV [EBP-0x304],ECX    ; this stored
#   007b12ee: c7 45 f0 00 00 00 00  MOV [EBP-0x10],0       ← hook here, 7 bytes
#   007b12f5:                       ...                     ; resume point
#
# The cut is the return-slot init — frame-relative, position-independent, and
# it never touches EAX, so the handler's consume return survives the replay
# into the wrapper's TEST EAX,EAX (no skip_original_bytes needed, unlike the
# Batch 1 GUI-manager hook whose cut loaded EAX).
#
# consumed_exit_address = 0x007B2E5E — the single epilogue, entered AFTER its
# `MOV EAX,[EBP-0x10]` return-value reload so the handler's EAX=1 survives
# (exclude_from_restore keeps it):
#   007b2e5b: 8b 45 f0              MOV EAX,[EBP-0x10]     ; (skipped)
#   007b2e5e: 8b 4d f4              MOV ECX,[EBP-0xC]      ← consumed entry
#   007b2e61: 64 89 0d 00 00 00 00  MOV FS:[0],ECX         ; SEH unregistered
#   007b2e68: 59                    POP ECX
#   007b2e69: 8b e5                 MOV ESP,EBP            ; frame torn down
#   007b2e6b: 5d                    POP EBP
#   007b2e6c: c2 08 00              RET 8
# MOV ESP,EBP makes the exit stack-depth-proof from any point after the
# prologue, and the FS restore properly unregisters the SEH frame the
# prologue installed — the same invariants the Batch 1 consumed exit keeps.
#
# Parameters: ecx = this (still live at the cut — the store doesn't clobber
# it), ebp = frame. The wrapper derives [ebp+8]/[ebp+0xc] (the two event
# args) and hands their ADDRESSES to the shared KOTOR 1 handler, preserving
# its caller_eip read at (param-slot - 4) = [ebp+4], the return address.
[[hooks]]
