# CExoSound::SetListenerPosition — K2 facade @0x0070B940 (single Vector*
# forward into the AIL listener writer 0x007082D0; one caller, the K2
# UpdateSoundEngine path — the same per-frame camera write K1 hooks).
# Hooked AT ENTRY with the whole prologue as the cut; the handler always
# returns 1 (consume) and performs the engine call itself with the possibly
# overridden position. skip_original_bytes = false, so the wrapper EXECUTES
# the cut (builds the EBP frame + PUSH ECX) before the consume exit —
# consumed_exit_address must therefore be the epilogue at 0x0070B95D
# (MOV ESP,EBP; POP EBP; RET 4), which unwinds exactly that frame. The bare
# RET 4 at 0x0070B960 is WRONG here: it pops the cut's saved ECX (the
# CExoSound*) as the return address and executes the sound object as code
# (first-fire crash on world load, dump-verified 2026-08-02).
# Params: ecx = this (CExoSound*), esp+4 = address of the Vector* slot
# (the LEA contract the shared handler expects).
[[hooks]]
