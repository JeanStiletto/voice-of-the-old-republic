# GENERATED for the Allard Russian build of swkotor.exe -- addresses only.
#
# Same hooks as hooks.toml, same original_bytes: the engine code at every
# hook site is byte-identical between the two builds, the linker just put it
# elsewhere (displacements of +16..+512 bytes, varying per function). The
# addresses come from `kdev sigscan`, which locates each site by a
# relocation-tolerant signature; the report is in build/re/sigscan/.
#
# consumed_exit_address values are NOT emitted by sigscan. They were rebased
# by their own hook's delta and each verified by comparing the opcode bytes
# at the rebased address against the reference image (2026-07-25). For the
# two shared epilogues the jump table that follows corroborates the delta:
# every entry shifts by the same amount.
#
# Design rationale for each hook -- why this cut, why these registers, which
# framework bugs it works around -- lives in hooks.toml. Do not duplicate it
# here; keep this file mechanical so it stays easy to regenerate.

