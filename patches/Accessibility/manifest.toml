[patch]
id = "accessibility"
name = "Voice of the Old Republic"
version = "0.6.4"
author = "Fabian"
description = "Screen reader accessibility for KotOR 1. Minimal infrastructure test patch."

requires = []
conflicts = []

# Reverse-engineered against the GoG 1.0.3 binary; engine bytes at our hook
# offsets are byte-identical between Steam 1.0.3, GoG 1.0.3, and one known
# GoG-equivalent CD re-pack (memory entry project_ghidra_gog_steam_bytes_match).
# All three are safe to enable.
[patch.supported_versions]
kotor1_steam_103 = "34E6D971C034222A417995D8E1E8FDD9F8781795C9C289BD86C499A439F34C88"
kotor1_gog_103 = "9C10E0450A6EECA417E036E3CDE7474FED1F0A92AAB018446D156944DEA91435"
kotor1_gog_103_cdrepack = "761F9466F456A83909036BAEBB5C43167D722387BE66E54617BA20A8C49E9886"

# The 2004-03-05 relink (PE link timestamp 0x4047CD47). Same BioWare source as
# the three above, relinked: the engine code is byte-identical but relocated
# (-320..+640 bytes, per function). Hook addresses come from relink2004.hooks.toml;
# the in-DLL constants are remapped at runtime by acc::addr::R
# (engine_rebase.cpp), which identifies the build from that timestamp.
#
# Two distributions ship this build, and they are the SAME binary for our
# purposes -- .text, .data and .rsrc are byte-identical between them and only
# 16 bytes of .rdata differ (Allard translated the hardcoded "Points Remaining"
# string). Both therefore use one hooks file and one rebase table; only the
# hashes differ.
kotor1_allard_ru_172 = "7B961A140667336D22B06686CBDCBE2DDDF8A0EA13C20A27B63BDC57A75D7628"
# KOTOR 2, Aspyr's 2015 rebuild — PORT IN PROGRESS, NOT A SUPPORTED GAME YET.
#
# Declaring these hashes makes the framework willing to install into KOTOR 2.
# Its hooks live in kotor2.hooks.toml, whose target_versions cover exactly
# these two SHAs; the two KOTOR 1 hooks files exclude them, so no KOTOR 1
# hook can ever land in the KOTOR 2 binary.
#
# A hook may only be added to kotor2.hooks.toml once its handler's whole
# read/call chain is verified against KOTOR 2 — every other handler
# default-denies via acc::game::HandlerEnabled(), and unresolved addresses
# (acc::addr::R) deliberately resolve to 0 there so they fault recognisably
# rather than jumping into unrelated code.
#
# See docs/kotor2-port.md. Both releases share Aspyr's build; the hashes differ
# because of the store wrapper.
kotor2_steam_aspyr = "6A522E71631DCEE93467BD2010F3B23D9145326E1E2E89305F13AB104DBBFFEF"
kotor2_gog_aspyr = "777BEE235A9E8BDD9863F6741BC3AC54BB6A113B62B1D2E4D12BBE6DB963A914"
# Official Polish edition by Licomp Empik Multimedia (LEM), 2004. Stock, unmodified
# LEM retail exe -- verified 2026-07-31: all 25 rebased hook signatures match it
# byte-for-byte, none of the vanilla-layout ones do.
kotor1_lem_pl_103 = "F96AC62BEE256DAC66B3F7DA3ED62DA4005B4710868E33FD0DB51164015D8137"
